name: Engage Stay — Isolated PostgreSQL Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/isolated-postgres-tests.yml'
      - 'scripts/**'
      - 'sql/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/isolated-postgres-tests.yml'
      - 'scripts/**'
      - 'sql/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: engage-stay-isolated-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-database:
    name: Test against disposable PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engage_test
          POSTGRES_PASSWORD: engage_test_only_not_production
          POSTGRES_DB: engage_stay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U engage_test -d engage_stay_test"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      NODE_ENV: test
      ENGAGE_TEST_DATABASE_ID: engage-stay-test-github-actions
      ENGAGE_TEST_DATABASE_URL: postgresql://engage_test:engage_test_only_not_production@127.0.0.1:5432/engage_stay_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies without production secrets
        run: npm ci --ignore-scripts
      - name: Verify fail-closed database safety guard
        run: |
          npm run test:isolated-db:guard
          node scripts/assert-isolated-test-db.js
      - name: Apply CI-only schema and synthetic fixtures
        run: node scripts/setup-isolated-postgres.js
      - name: Run actual PostgreSQL acceptance tests
        run: node --test src/postgres-acceptance.test.js
      - name: Run existing regression suite without a database fallback
        env:
          ENGAGE_TEST_DATABASE_URL: ''
          ENGAGE_TEST_DATABASE_ID: ''
        run: npm test
      - name: Report verified scope
        run: |
          echo "Disposable PostgreSQL 16 schema and synthetic fixtures applied." >> "$GITHUB_STEP_SUMMARY"
          echo "Property isolation, identity suspension and row-lock/CAS concurrency tests executed against PostgreSQL." >> "$GITHUB_STEP_SUMMARY"
          echo "Production Supabase RLS acceptance remains a separate staging-only requirement." >> "$GITHUB_STEP_SUMMARY"
