name: Engage Stay — Isolated PostgreSQL Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/isolated-postgres-tests.yml'
      - 'scripts/**'
      - 'sql/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/isolated-postgres-tests.yml'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: engage-stay-isolated-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-database:
    name: Test against disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engage_test
          POSTGRES_PASSWORD: engage_test_only_not_production
          POSTGRES_DB: engage_stay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engage_test -d engage_stay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      ENGAGE_TEST_DATABASE_ID: engage-stay-test-github-actions
      ENGAGE_TEST_DATABASE_URL: postgresql://engage_test:engage_test_only_not_production@127.0.0.1:5432/engage_stay_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without postinstall or production secrets
        run: npm ci --ignore-scripts

      - name: Verify actual disposable PostgreSQL identity before tests
        run: node scripts/assert-isolated-test-db.js

      - name: Exercise fail-closed database safety guard
        run: npm run test:isolated-db:guard

      - name: Apply actual managed workspace migration to temporary PostgreSQL
        run: node scripts/setup-isolated-postgres.js

      - name: Run existing application regression suite
        run: npm test

      - name: Run real PostgreSQL reservation concurrency suite
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/postgres-concurrency.test.js | tee postgres-concurrency.tap

      - name: Summarize PostgreSQL test results
        if: always()
        shell: bash
        run: |
          {
            echo "## Engage Stay isolated PostgreSQL 16"
            echo "Database: engage_stay_test / engage_test on local GitHub Actions service"
            echo "Managed workspace schema: sql/managed-workspace.sql"
            if [[ -f postgres-concurrency.tap ]]; then
              echo '### Concurrency tests'
              grep -E '^# (tests|pass|fail|cancelled|skipped|duration_ms) ' postgres-concurrency.tap || true
            else
              echo 'Concurrency suite did not start or did not produce output.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-concurrency-tap
          path: postgres-concurrency.tap
          if-no-files-found: ignore
